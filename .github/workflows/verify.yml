name: Verify evidence lab
on:
  push:
    branches: [main, feat/executable-evidence-lab]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  explorer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12.14'
          - os: windows-latest
            python: '3.12.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LAB_SCREENSHOT_DIR: .cache/screenshots
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      # Hosted Ubuntu/Windows images already supply the Chromium runtime
      # libraries. Avoid unrelated apt upgrades; real browser tests below
      # still fail if a required library is missing.
      - run: python -m playwright install chromium
        timeout-minutes: 5
      - run: python -c "from pathlib import Path; Path('.cache').mkdir(exist_ok=True)"
      - run: python -m pytest -q --basetemp .cache/tests --junitxml .cache/tests.xml
      - name: Review recorded UI layouts and contrast
        run: python scripts/capture_presentation.py --images .cache/presentation/screenshots --evidence .cache/presentation/capture.json
      - name: Verify SDR research static build and accessibility
        run: python scripts/capture_research.py --images .cache/research/screenshots --output .cache/research/browser.json
      - name: Verify recorded model release and accessibility
        run: python scripts/capture_release.py --images .cache/release/screenshots --output .cache/release/browser.json
      - name: Verify Revenue Integrity static investigation
        run: python scripts/capture_integrity.py --images .cache/integrity/screenshots --output .cache/integrity/browser.json
      - name: Verify analytics evidence, layouts and accessibility
        run: python scripts/capture_analytics.py --images .cache/analytics/screenshots --output .cache/analytics/browser.json
      - name: Verify measurement evidence, layouts and accessibility
        run: python scripts/capture_measurement.py --images .cache/measurement/screenshots --output .cache/measurement/browser.json
      - name: Verify architecture, reliability and temporal investigations
        run: python scripts/capture_assurance.py --images .cache/assurance/screenshots --output .cache/assurance/browser.json
      - run: python scripts/check_repository.py
      - run: python scripts/build.py
  source-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: lab_admin
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      LAB_POSTGRES_ADMIN_DSN: host=127.0.0.1 port=5432 user=lab_admin password=disposable-ci-only dbname=postgres connect_timeout=5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.lock
      - run: python -m revenue_lab.cli prepare seller --install
      - run: python -m revenue_lab.cli prepare control --install
      - run: python -m revenue_lab.cli prepare revenue --install
      - run: python -m revenue_lab.cli run seller-stale
      - run: python -m revenue_lab.cli run seller-suppressed
      - run: python -m revenue_lab.cli run seller-delivery
      - run: python -m revenue_lab.cli run control-recovery
      - run: python -m revenue_lab.cli run revenue-correction
      - name: Diagnose original engine failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          paths = sorted(Path(".cache/runs").glob("revenue-correction-*/execution.log"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not paths:
              print("No revenue execution.log; the worker may have failed before log capture.")
          else:
              path = paths[0]
              failure = path.with_name("failure.json")
              if failure.exists():
                  print("Failure metadata:", failure.read_text())
              tail = "\n".join(path.read_text(errors="replace").splitlines()[-100:])
              tail = re.sub(r"(?i)(password|token|secret)=([^\s]+)", r"\1=[REDACTED]", tail)
              tail = tail.replace("disposable-ci-only", "[REDACTED]")
              print("Original engine log, last 100 lines (max 8000 characters):")
              print(tail[-8000:])
              # The original runner stores dbt errors in a nested file rather
              # than stdout. Keep the finite synthetic failure diagnosable.
              for log in sorted(path.parent.rglob("dbt-build.log")):
                  text = "\n".join(log.read_text(errors="replace").splitlines()[-80:])
                  text = re.sub(r"(?i)(password|token|secret)=([^\s]+)", r"\1=[REDACTED]", text)
                  print("Nested dbt log:", log.relative_to(path.parent))
                  print(text.replace("disposable-ci-only", "[REDACTED]")[-8000:])
          PY
