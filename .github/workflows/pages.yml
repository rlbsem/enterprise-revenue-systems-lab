name: Publish static evidence lab

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Install locked build dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify recorded evidence and repository inventory
        run: python scripts/check_repository.py
      - name: Build static application
        run: python scripts/build.py
      - name: Verify static-only artifact boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source, output = Path('web'), Path('dist')
          expected = {p.relative_to(source) for p in source.rglob('*') if p.is_file()}
          actual = {p.relative_to(output) for p in output.rglob('*') if p.is_file()}
          assert actual == expected, 'Static artifact inventory differs from web/'
          assert not any(p.is_symlink() for p in output.rglob('*')), 'Symlinks are not publishable'
          for name in actual:
              assert (output / name).read_bytes() == (source / name).read_bytes(), name
          print(f'Verified {len(actual)} static files; no local execution components included')
          PY
      - name: Upload only the static distribution
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read owner-configured Pages settings
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Publish the verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
