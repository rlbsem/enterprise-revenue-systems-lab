name: Verify hosted evidence

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish static evidence lab]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosted-evidence
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - name: Check the published explorer against the deployed revision
        run: python scripts/verify_hosted.py
      - name: Preserve read-only observations and checked downloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-evidence-${{ github.run_id }}
          path: .cache/hosted/
          if-no-files-found: error
          retention-days: 14
